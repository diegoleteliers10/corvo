[package]
name = "corvo-ui"
version = "0.1.8"
edition = "2021"
publish = false

[dependencies]
corvo-app-launcher = { path = "../../commands/app-launcher" }
corvo-brew = { path = "../../commands/brew" }
corvo-clipboard-manager = { path = "../../commands/clipboard-manager" }
corvo-config = { workspace = true }
corvo-core = { workspace = true }
corvo-platform = { workspace = true }
corvo-system-actions = { path = "../../commands/system-actions" }
corvo-web-search-fallback = { path = "../../commands/web-search-fallback" }
corvo-window-management = { path = "../../commands/window-management" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
phosphor-svgs = { workspace = true }
serde_json = "1"
smol = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"
smallvec = "1"
