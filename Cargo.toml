[package]
name = "corvo"
version = "0.4.0"
edition = "2021"
description = "A lightweight native launcher"
publish = false

[[bin]]
name = "corvo"
path = "src/main.rs"

[package.metadata.deb]
name = "corvo"
maintainer = "Diego Letelier <diegoleteliers10@users.noreply.github.com>"
copyright = "2026, Diego Letelier"
license-file = ["LICENSE", "0"]
extended-description = """\
Corvo is a lightweight native application launcher designed for speed, \
low memory usage, and seamless developer workflows. Built with Rust and GPUI, \
it offers raycast-like commands, window management, system actions, clipboard history, \
and a fully configurable setup."""
section = "utils"
priority = "optional"
revision = ""
assets = [
    ["target/release/corvo", "usr/bin/", "755"],
    ["packaging/linux/corvo.desktop", "usr/share/applications/", "644"],
    ["assets/corvoIcon.png", "usr/share/icons/hicolor/512x512/apps/corvo.png", "644"],
    ["assets/corvoIcon.png", "usr/share/pixmaps/corvo.png", "644"],
    ["README.md", "usr/share/doc/corvo/README.md", "644"],
]

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[workspace]
resolver = "2"
members = [
    "crates/corvo-core",
    "crates/corvo-ext",
    "crates/corvo-platform",
    "crates/corvo-ui",
    "crates/corvo-config",
    "commands/app-launcher",
    "commands/file-search",
    "commands/clipboard-manager",
    "commands/calculator",
    "commands/snippets",
    "commands/window-management",
    "commands/emoji-picker",
    "commands/quicklinks",
    "commands/system-actions",
    "commands/web-search-fallback",
    "commands/kill-process",
    "commands/brew",
    "commands/text-utilities",
    "commands/pomodoro",
    "commands/weather",
    "commands/notes",
    "commands/media-control",
    "commands/browser-tabs",
]

[workspace.dependencies]
async-trait = "0.1"
frizbee = "0.13"
corvo-config = { path = "crates/corvo-config" }
corvo-core = { path = "crates/corvo-core" }
corvo-ext = { path = "crates/corvo-ext" }
corvo-platform = { path = "crates/corvo-platform" }
directories = "6"
phosphor-svgs = { version = "0.6.0-pre.1", default-features = false, features = ["str"] }
serde = { version = "1", features = ["derive"] }
smol = "2"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
semver = { version = "1.0", default-features = false, features = ["std", "serde"] }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
minisign-verify = "0.2"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }

[dependencies]
corvo-app-launcher = { path = "commands/app-launcher" }
corvo-brew = { path = "commands/brew" }
corvo-calculator = { path = "commands/calculator" }
corvo-clipboard-manager = { path = "commands/clipboard-manager" }
corvo-config = { path = "crates/corvo-config" }
corvo-core = { path = "crates/corvo-core" }
corvo-emoji-picker = { path = "commands/emoji-picker" }
corvo-file-search = { path = "commands/file-search" }
corvo-kill-process = { path = "commands/kill-process" }
corvo-platform = { path = "crates/corvo-platform" }
corvo-pomodoro = { path = "commands/pomodoro" }
corvo-weather = { path = "commands/weather" }
corvo-notes = { path = "commands/notes" }
corvo-media-control = { path = "commands/media-control" }
corvo-browser-tabs = { path = "commands/browser-tabs" }
corvo-quicklinks = { path = "commands/quicklinks" }
corvo-snippets = { path = "commands/snippets" }
corvo-system-actions = { path = "commands/system-actions" }
corvo-text-utilities = { path = "commands/text-utilities" }
corvo-ui = { path = "crates/corvo-ui" }
corvo-web-search-fallback = { path = "commands/web-search-fallback" }
corvo-window-management = { path = "commands/window-management" }
smol = { workspace = true }
