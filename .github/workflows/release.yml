name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Resolve Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build - ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: corvo-x86_64-unknown-linux-gnu.tar.gz
            deb_name: corvo_${{ needs.prepare.outputs.version }}_amd64.deb
            appimage_name: Corvo_${{ needs.prepare.outputs.version }}_amd64.AppImage
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: corvo-x86_64-apple-darwin.tar.gz
            dmg_name: corvo-x86_64-apple-darwin.dmg
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: corvo-aarch64-apple-darwin.tar.gz
            dmg_name: corvo-aarch64-apple-darwin.dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: corvo-x86_64-pc-windows-msvc.zip
            msi_name: Corvo_${{ needs.prepare.outputs.version }}_x64.msi

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libxfixes-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary (Release Mode)
        run: cargo build --release --target ${{ matrix.target }}

      # Packaging for Linux
      - name: Package Binary (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/corvo dist/corvo
          cd dist
          tar -czf ../${{ matrix.artifact_name }} corvo
          cd ..

      # Debian package (.deb)
      - name: Install cargo-deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y dpkg-dev
          cargo install cargo-deb --locked

      - name: Build DEB Package (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --output "${{ matrix.deb_name }}"
          ls -la "${{ matrix.deb_name }}"

      # Universal AppImage for Linux
      - name: Build AppImage (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y libfuse2 imagemagick || sudo apt-get install -y libfuse2t64 imagemagick || true

          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-appimage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"

          convert assets/corvoIcon.png -resize 256x256 corvo-icon-256.png

          mkdir -p AppDir
          ./linuxdeploy \
            --appdir AppDir \
            --executable target/${{ matrix.target }}/release/corvo \
            --desktop-file packaging/linux/corvo.desktop \
            --icon-file corvo-icon-256.png \
            --icon-filename corvo \
            --output appimage

          mv Corvo-*.AppImage "${{ matrix.appimage_name }}"
          ls -la "${{ matrix.appimage_name }}"

      # Packaging for macOS (App Bundle)
      - name: Package Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Corvo.app/Contents/MacOS
          mkdir -p dist/Corvo.app/Contents/Resources

          cp target/${{ matrix.target }}/release/corvo dist/Corvo.app/Contents/MacOS/corvo
          cp assets/corvoIcon.icns dist/Corvo.app/Contents/Resources/AppIcon.icns

          cat <<EOF > dist/Corvo.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>corvo</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>sh.corvo.corvo</string>
              <key>CFBundleName</key>
              <string>Corvo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSCalendarsFullAccessUsageDescription</key>
              <string>Corvo reads your calendar to show upcoming meetings and quick join links.</string>
              <key>NSCalendarsUsageDescription</key>
              <string>Corvo reads your calendar to show upcoming meetings and quick join links.</string>
          </dict>
          </plist>
          EOF

          codesign --force --deep -s - dist/Corvo.app

          cd dist
          tar -czf ../${{ matrix.artifact_name }} Corvo.app
          ditto -c -k --keepParent Corvo.app ../corvo-${{ matrix.target }}.zip
          cd ..

      # DMG installer (with Applications symlink)
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          STAGING_DIR=$(mktemp -d)
          cp -R dist/Corvo.app "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "Corvo" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "${{ matrix.dmg_name }}"

          rm -rf "$STAGING_DIR"

      # Packaging for Windows (.zip)
      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path target\${{ matrix.target }}\release\corvo.exe -Destination dist\corvo.exe
          Compress-Archive -Path dist\corvo.exe -DestinationPath ${{ matrix.artifact_name }}

      # MSI Installer (Windows WiX Toolset v3)
      - name: Build MSI Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Join-Path $env:WIX 'bin\candle.exe'
          $light  = Join-Path $env:WIX 'bin\light.exe'
          $binDir = "target\${{ matrix.target }}\release"
          $wixVersion = ($env:VERSION -replace '-.*$', '').Trim('.')
          if ($wixVersion -notmatch '^\d+(\.\d+)*$') { $wixVersion = "0.1.0" }

          & $candle -nologo -arch x64 -dVersion="$wixVersion" -dBinDir="$binDir" -out wix\main.wixobj wix\main.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed with exit code $LASTEXITCODE" }

          & $light -nologo -ext WixUIExtension -sw69 -sw91 -out "${{ matrix.msi_name }}" wix\main.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed with exit code $LASTEXITCODE" }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

      - name: Upload DMG Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.dmg_name }}
          retention-days: 1

      - name: Upload macOS Zip Bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-zip
          path: corvo-${{ matrix.target }}.zip
          retention-days: 1

      - name: Upload MSI Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-msi
          path: ${{ matrix.msi_name }}
          retention-days: 1

      - name: Upload DEB Artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-deb
          path: ${{ matrix.deb_name }}
          retention-days: 1

      - name: Upload AppImage Artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-appimage
          path: ${{ matrix.appimage_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts Structure
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          cd ..
          ls -la release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-cask:
    name: Update Homebrew Cask
    needs: [prepare, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download macOS DMG Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apple-darwin-dmg'
          path: dmgs
          merge-multiple: true

      - name: Compute Checksums
        id: sha
        run: |
          ARM_SHA=$(sha256sum dmgs/corvo-aarch64-apple-darwin.dmg | awk '{print $1}')
          INTEL_SHA=$(sha256sum dmgs/corvo-x86_64-apple-darwin.dmg | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$INTEL_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Cask File
        run: |
          sed -i -E "s/version \"[^\"]+\"/version \"${VERSION}\"/" Casks/corvo.rb
          sed -i -E "s/arm:[[:space:]]+\"[a-f0-9]+\"/arm:   \"${{ steps.sha.outputs.arm_sha }}\"/" Casks/corvo.rb
          sed -i -E "s/intel:[[:space:]]+\"[a-f0-9]+\"/intel: \"${{ steps.sha.outputs.intel_sha }}\"/" Casks/corvo.rb
          cat Casks/corvo.rb

      - name: Commit and Push Cask Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/corvo.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Homebrew cask to v${VERSION}"
            git push origin HEAD:main
          fi
