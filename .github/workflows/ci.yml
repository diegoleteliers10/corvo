name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libxfixes-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The release workflow builds only on a tag, so a change that breaks
      # one target stays unnoticed until the next release. This runs the
      # same type check on every push to main, for every target.
      - name: Check
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

      - name: Test workspace
        run: cargo test --workspace --no-fail-fast --target ${{ matrix.target }}

      # The extension template is not a workspace member; this proves
      # it still compiles and passes its tests as one.
      - name: Check extension template
        run: ./scripts/check-template.sh

      - name: Test Windows platform
        if: runner.os == 'Windows'
        run: cargo test -p corvo-platform --lib --target ${{ matrix.target }} windows
